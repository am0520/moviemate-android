name: Update Screenshot References

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-screenshots:
    runs-on: ${{ vars.SCREENSHOT_RUNNER }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: ${{ vars.JAVA_DISTRIBUTION }}
          java-version: ${{ vars.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Update screenshot references
        run: ./gradlew updateDebugScreenshotTest

      - name: Commit updated references
        shell: bash
        run: |
          git add -- ':(glob)**/src/screenshotTestDebug/reference/**'

          if git diff --cached --quiet; then
            echo "No screenshot references changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update screenshot references"
          git push
