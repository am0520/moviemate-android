name: Record Screenshot References

run-name: Record screenshots from ${{ github.ref_name }}

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Record Roborazzi screenshots

    runs-on: ${{ vars.CI_RUNNER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: ${{ vars.JAVA_DISTRIBUTION }}
          java-version: ${{ vars.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Record screenshots
        run: ./gradlew recordRoborazziDebug

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-references
          path: "**/src/test/screenshots/**"
          if-no-files-found: error
          retention-days: 1

  accept:
    name: Accept screenshot references

    needs: record

    runs-on: ${{ vars.CI_RUNNER }}

    permissions:
      contents: write

    environment:
      name: screenshot-approval

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download screenshots
        uses: actions/download-artifact@v8
        with:
          name: screenshot-references
          path: .

      - name: Commit screenshots
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "🤖test(screenshot): update reference images"
          file_pattern: "**/src/test/screenshots/**"
          disable_globbing: true
