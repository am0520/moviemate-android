name: Record Screenshot References

run-name: Record screenshots from ${{ github.ref_name }}

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Record Roborazzi screenshots

    runs-on: ${{ vars.CI_RUNNER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: ${{ vars.JAVA_DISTRIBUTION }}
          java-version: ${{ vars.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Record screenshots
        run: ./gradlew recordRoborazziDebug

      - name: Collect changed screenshots
        shell: bash
        run: |
          mkdir -p review-screenshots
          mkdir -p commit-screenshots

          git ls-files \
            --modified \
            --others \
            --exclude-standard \
            -- '**/src/test/screenshots/**' |
          while IFS= read -r file; do

            relative="${file#*/src/test/screenshots/}"

            mkdir -p "review-screenshots/$(dirname "$relative")"
            cp "$file" "review-screenshots/$relative"

            # Preserve the real repository path for accepting later.
            mkdir -p "commit-screenshots/$(dirname "$file")"
            cp "$file" "commit-screenshots/$file"
          done

      - name: Upload screenshots for review
        uses: actions/upload-artifact@v7
        with:
          name: review-screenshots
          path: review-screenshots/
          if-no-files-found: error
          retention-days: 1

      - name: Upload screenshots for accepting
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-references
          path: commit-screenshots/
          if-no-files-found: error
          retention-days: 1
